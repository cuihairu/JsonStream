# 只做验证，不做发布：每次推送/PR 跑 vet + 静态检查 + 竞态测试 + 基准冒烟 + 覆盖率门禁 + fuzz 冒烟。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      # gosec 固定版本（新版规则漂移不打断 CI）；零告警基线含带理由的
      # #nosec 声明，从 CI 起受门禁保护。
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet ./...
      - run: |
          go install github.com/mgechev/revive@latest
          revive -set_exit_status ./...
      # -count=1 不是冗余：setup-go 默认开 cache（keyed on go.sum），GOCACHE
      # 命中时 go test 直接报 (cached) 并不执行任何测试——只改文档/工作流的
      # 推送会拿到"全绿但什么都没跑"的结果。实测（DESIGN §11.5）：第二次
      # `go test -race ./...` 输出 (cached)。门禁要能证明自己跑过。
      - run: go test -race -count=1 ./...
      - run: go test -bench . -benchtime 1x ./...
      # 覆盖率门禁只针对库包：examples/ 里有若干"只能在微秒级竞态里触发"的
      # 防御分支（示例是文档，不为覆盖率改形）。库包必须保持 100%——它没有
      # 任何"测不到就是死码"的托词，测试接缝已覆盖全部防御分支。
      # -count=1 同上：覆盖率 profile 也进测试缓存，复用旧 profile 等于用
      # 上一次的结果冒充这次的证据。
      - name: coverage gate (library = 100%)
        run: |
          go test -coverprofile=coverage.out -count=1 .
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "library coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 100) { printf "coverage %.1f%% < 100%%\n", p; exit 1 } }'
      # 种子语料随上面的 go test 常规跑过了，这一步是真正的挖掘：每个 fuzz
      # 靶按固定预算随机变异，崩溃即失败，并把 crash 语料写进
      # testdata/fuzz/<Target>/——提交回来就是一条永久回归用例。
      #
      # 靶名用 `go test -list` 发现而不是手写：新增 fuzz 靶不需要改 CI，
      # 也就不会"静默不跑"（覆盖率门禁那种承诺腐烂的同款风险）。逐包扫而
      # 不是只扫根包——`go test -list 'Fuzz.*' .` 只看根包，靶挪进子包
      # （或干脆新开一个包）就会被静默漏掉，正好是这一步要根除的那个风险。
      #
      # 预算 20s/靶是 CI 能接受的探索量，不是"无崩溃"的证明：本地实测三靶
      # 合计落在"十万次变异"量级（绝对吞吐是 CPU 供给的函数，跨机器差到
      # 数倍，别当基线用；区间口径见 DESIGN §11.4），而 README bug 清单
      # 1、2 两个真 bug 是单靶深挖（分钟级）才撞出来的。也不带 -race：race
      # detector 下变异吞吐掉一个数量级，同样的墙钟预算只能换到 1/10 的
      # 探索量，而这一步的目标是"panic 与契约不变量的廉价回归网"——竞态
      # 由上面那条 `-race` 全量跑负责，两者分工不同。
      - name: fuzz smoke (20s per target)
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            for t in $(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz' || true); do
              found=$((found + 1))
              echo "fuzzing $t ($pkg)"
              go test -run '^$' -fuzz "^${t}\$" -fuzztime 20s "$pkg"
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "no fuzz targets discovered -- the step would silently pass forever"; exit 1
          fi
          echo "fuzzed $found target(s)"

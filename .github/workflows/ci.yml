# 只做验证，不做发布：每次推送/PR 跑 vet + 竞态测试 + 基准冒烟。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -bench . -benchtime 1x ./...
